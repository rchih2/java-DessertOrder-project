server:
  port: 8088

stock:
  pool-file: stock-pool.txt
  kline-periods: daily,weekly,monthly

# 钉钉企业内部应用
dingtalk:
  enabled: true
  app-key: YOUR_APP_KEY
  app-secret: YOUR_APP_SECRET
  agent-id: YOUR_AGENT_ID
  user-id-list:

# 腾讯混元大模型
tencent-ai:
  enabled: true
  api-key: YOUR_API_KEY
  model: hunyuan-lite
  base-url: https://hunyuan.tencentcloudapi.com

schedule:
  anomaly-monitor: "0 */5 9-14 ? * MON-FRI"
  stock-select: "0 30 15 ? * MON-FRI"
  news-push: "0 0 8 ? * *"
